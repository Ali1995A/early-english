<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幼儿英语口语教程（3-6岁）</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #fdf8f3;
      --color-card: #fffefb;
      --color-text: #4a4a4a;
      --color-text-light: #6b6b6b;
      --color-primary: #ffb347;
      --color-primary-light: #fff5e6;
      --color-secondary: #87ceeb;
      --color-secondary-light: #e6f4f9;
      --color-mint: #98d8c8;
      --color-mint-light: #e8f6f2;
      --color-coral: #ff9b8a;
      --color-lavender: #c5b9e0;
      --color-peach: #ffccbc;
      --color-sage: #b8c5b9;
      --color-lilac: #e1bee7;
      --color-gold: #ffd54f;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 16px rgba(0,0,0,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Navigation */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(255,254,251,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .navbar-brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar-brand span {
      font-size: 1.5rem;
    }

    .navbar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--color-text-light);
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: var(--color-primary-light);
      color: var(--color-text);
    }

    .nav-search {
      display: flex;
      align-items: center;
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      gap: 8px;
    }

    .nav-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.9rem;
      width: 140px;
    }

    /* Main Content */
    .main-content {
      padding-top: 80px;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 60px;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 40px 0 60px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-coral));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--color-text-light);
      margin-bottom: 24px;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--color-text-light);
    }

    .hero-progress {
      max-width: 400px;
      margin: 0 auto;
    }

    .progress-bar {
      height: 8px;
      background: #e8e8e8;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-primary), var(--color-coral));
      border-radius: 4px;
      transition: width 0.3s;
    }

    .progress-text {
      font-size: 0.875rem;
      color: var(--color-text-light);
      margin-top: 8px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--color-primary), #ff9a56);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255,179,71,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255,179,71,0.4);
    }

    /* Phase Cards */
    .phases-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 1024px) {
      .phases-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .phases-grid {
        grid-template-columns: 1fr;
      }
    }

    .phase-card {
      background: var(--color-card);
      border-radius: var(--radius-md);
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .phase-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .phase-card:nth-child(1)::before { background: var(--color-coral); }
    .phase-card:nth-child(2)::before { background: var(--color-gold); }
    .phase-card:nth-child(3)::before { background: var(--color-mint); }
    .phase-card:nth-child(4)::before { background: var(--color-secondary); }
    .phase-card:nth-child(5)::before { background: var(--color-lavender); }
    .phase-card:nth-child(6)::before { background: var(--color-peach); }
    .phase-card:nth-child(7)::before { background: var(--color-sage); }
    .phase-card:nth-child(8)::before { background: var(--color-lilac); }

    .phase-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .phase-card.completed {
      border-color: var(--color-mint);
    }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .phase-number {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .phase-status {
      font-size: 1.25rem;
    }

    .phase-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--color-text);
    }

    .phase-desc {
      font-size: 0.875rem;
      color: var(--color-text-light);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .phase-scenes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-scene-tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: var(--color-bg);
      border-radius: 12px;
      color: var(--color-text-light);
    }

    /* Phase Detail Page */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--color-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--color-primary-light);
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .scenes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 768px) {
      .scenes-grid {
        grid-template-columns: 1fr;
      }
    }

    .scene-card {
      background: var(--color-card);
      border-radius: var(--radius-md);
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      display: flex;
      gap: 16px;
    }

    .scene-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .scene-card.completed {
      border-color: var(--color-mint);
    }

    .scene-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      flex-shrink: 0;
    }

    .scene-content {
      flex: 1;
    }

    .scene-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .scene-desc {
      font-size: 0.875rem;
      color: var(--color-text-light);
      margin-bottom: 12px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .scene-stats {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--color-text-light);
    }

    .scene-stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Scene Detail Page */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--color-text-light);
      margin-bottom: 16px;
    }

    .breadcrumb a {
      color: var(--color-primary);
      cursor: pointer;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .scene-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .scene-header-icon {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .scene-header-info h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .scene-header-desc {
      color: var(--color-text-light);
      font-size: 0.95rem;
    }

    .scene-actions {
      display: flex;
      gap: 12px;
      margin-left: auto;
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--color-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--color-primary-light);
    }

    .btn-icon.active {
      background: var(--color-coral);
      color: white;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--color-bg);
      padding-bottom: 8px;
    }

    .tab {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab:hover {
      background: var(--color-bg);
    }

    .tab.active {
      background: var(--color-primary);
      color: white;
    }

    /* Content Sections */
    .content-section {
      background: var(--color-card);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Sentences List - Card Style for Mobile */
    .sentences-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sentence-card {
      background: var(--color-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s;
    }

    .sentence-card:hover {
      box-shadow: var(--shadow);
    }

    .sentence-card-main {
      flex: 1;
      min-width: 0;
    }

    .sentence-card-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .sentence-card .sentence-en {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 6px;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sentence-card .sentence-cn {
      font-size: 0.9rem;
      color: var(--color-text-light);
    }

    .sentence-card .sentence-tone {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--color-card);
    }

    /* Desktop: Table Style */
    @media (min-width: 769px) {
      .sentences-list {
        display: table;
        width: 100%;
        border-collapse: collapse;
      }

      .sentence-card {
        display: table-row;
        background: transparent;
        padding: 0;
      }

      .sentence-card:hover {
        box-shadow: none;
      }

      .sentence-card-main {
        display: table-cell;
        padding: 16px 12px;
        border-bottom: 1px solid var(--color-bg);
      }

      .sentence-card-meta {
        display: table-cell;
        padding: 16px 12px;
        border-bottom: 1px solid var(--color-bg);
        vertical-align: middle;
        flex-direction: row;
        align-items: center;
      }

      .sentence-card .sentence-en {
        margin-bottom: 4px;
      }
    }

    .sentence-en {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 4px;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .play-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: var(--color-primary-light);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--color-primary);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .play-btn:hover {
      background: var(--color-primary);
      color: white;
      transform: scale(1.1);
    }

    .play-btn.playing {
      background: var(--color-mint);
      color: white;
    }

    .sentence-cn {
      font-size: 0.9rem;
      color: var(--color-text-light);
    }

    .sentence-tone {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--color-bg);
    }

    .fav-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.25rem;
      opacity: 0.4;
      transition: all 0.2s;
    }

    .fav-btn:hover, .fav-btn.active {
      opacity: 1;
    }

    .fav-btn.active {
      color: var(--color-coral);
    }

    /* Vocabulary Grid */
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .vocab-item {
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: 16px;
      position: relative;
    }

    .vocab-word {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
      font-family: 'Nunito', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vocab-play-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: var(--color-primary-light);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--color-primary);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .vocab-play-btn:hover {
      background: var(--color-primary);
      color: white;
      transform: scale(1.1);
    }

    .vocab-phonetic {
      font-size: 0.85rem;
      color: var(--color-text-light);
      margin-bottom: 8px;
      font-family: 'Nunito', sans-serif;
    }

    .vocab-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .vocab-pos {
      padding: 2px 8px;
      background: var(--color-card);
      border-radius: 4px;
      color: var(--color-text-light);
    }

    .vocab-cn {
      color: var(--color-text-light);
    }

    .vocab-fav {
      position: absolute;
      top: 8px;
      right: 8px;
    }

    /* Dialogs */
    .dialog-group {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--color-bg);
    }

    .dialog-group:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .dialog-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-light);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dialog-bubble {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .dialog-bubble:last-child {
      margin-bottom: 0;
    }

    .dialog-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .dialog-avatar.parent {
      background: var(--color-primary-light);
    }

    .dialog-avatar.child {
      background: var(--color-secondary-light);
    }

    .dialog-content {
      flex: 1;
    }

    .dialog-speaker {
      font-size: 0.8rem;
      color: var(--color-text-light);
      margin-bottom: 4px;
    }

    .dialog-text {
      background: var(--color-bg);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 1rem;
    }

    .dialog-text .cn {
      font-size: 0.875rem;
      color: var(--color-text-light);
      margin-top: 4px;
    }

    /* Games */
    .game-item {
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      padding: 20px;
      margin-bottom: 16px;
    }

    .game-item:last-child {
      margin-bottom: 0;
    }

    .game-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-title span {
      font-size: 1.5rem;
    }

    .game-desc {
      color: var(--color-text-light);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Review */
    .review-list {
      list-style: none;
    }

    .review-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-bg);
      cursor: pointer;
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--color-mint);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .review-checkbox.checked {
      background: var(--color-mint);
    }

    .review-checkbox.checked::after {
      content: '✓';
      color: white;
      font-weight: bold;
    }

    .review-text {
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .review-item.checked .review-text {
      color: var(--color-text-light);
      text-decoration: line-through;
    }

    /* Tips */
    .tips-box {
      background: linear-gradient(135deg, var(--color-primary-light), #fff5e6);
      border-radius: var(--radius-sm);
      padding: 20px;
      border-left: 4px solid var(--color-primary);
    }

    .tips-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tips-content {
      color: var(--color-text);
      line-height: 1.7;
    }

    /* Favorites Page */
    .favorites-empty {
      text-align: center;
      padding: 60px 20px;
    }

    .favorites-empty-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .favorites-empty-text {
      color: var(--color-text-light);
      font-size: 1rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--color-text-light);
      font-size: 0.875rem;
    }

    /* Print styles */
    @media print {
      .navbar, .btn-icon, .fav-btn, .tabs, .back-btn {
        display: none !important;
      }

      .main-content {
        padding-top: 20px;
      }

      .content-section {
        break-inside: avoid;
      }
    }

    /* Mobile menu */
    .mobile-menu-btn {
      display: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: block;
      }

      .navbar-nav {
        display: none;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        background: var(--color-card);
        flex-direction: column;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .navbar-nav.open {
        display: flex;
      }

      .hero h1 {
        font-size: 1.5rem;
      }

      .hero-subtitle {
        font-size: 0.9rem;
      }

      .hero-stats {
        gap: 16px;
        flex-wrap: wrap;
      }

      .stat-number {
        font-size: 1.75rem;
      }

      .phases-grid {
        grid-template-columns: 1fr;
      }

      .phase-card {
        padding: 16px;
      }

      .scenes-grid {
        grid-template-columns: 1fr;
      }

      .scene-card {
        flex-direction: column;
        text-align: center;
        gap: 12px;
      }

      .scene-icon {
        margin: 0 auto;
      }

      .scene-header {
        flex-direction: column;
        text-align: center;
      }

      .scene-actions {
        margin-left: 0;
        margin-top: 16px;
      }

      .tabs {
        flex-wrap: wrap;
        gap: 6px;
      }

      .tab {
        padding: 8px 14px;
        font-size: 0.85rem;
      }

      .sentences-table {
        font-size: 0.9rem;
      }

      .sentences-table th:nth-child(3),
      .sentences-table td:nth-child(3) {
        display: none;
      }

      .sentences-table td {
        padding: 12px 8px;
      }

      .sentence-en {
        font-size: 1rem;
        flex-wrap: wrap;
      }

      .vocab-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .vocab-item {
        padding: 12px;
      }

      .vocab-word {
        font-size: 1rem;
        flex-wrap: wrap;
      }

      .dialog-bubble {
        gap: 8px;
      }

      .dialog-avatar {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }

      .dialog-text {
        padding: 10px 12px;
        font-size: 0.95rem;
      }

      .game-item {
        padding: 16px;
      }

      .game-title {
        font-size: 0.95rem;
        flex-wrap: wrap;
        gap: 6px;
      }

      .main-content {
        padding: 80px 12px 20px;
      }

      .content-section {
        padding: 16px;
      }

      .play-btn, .vocab-play-btn {
        width: 32px;
        height: 32px;
        font-size: 0.85rem;
      }

      .review-item {
        padding: 10px 0;
      }

      .review-text {
        font-size: 0.9rem;
      }
    }

    /* 手机竖屏优化 */
    @media (max-width: 480px) {
      .navbar-brand {
        font-size: 1rem;
      }

      .navbar-brand span {
        font-size: 1.25rem;
      }

      .hero {
        padding: 20px 16px;
      }

      .hero h1 {
        font-size: 1.35rem;
      }

      .stat-item {
        min-width: 80px;
      }

      .stat-number {
        font-size: 1.5rem;
      }

      .stat-label {
        font-size: 0.75rem;
      }

      .phase-card {
        padding: 14px;
      }

      .phase-title {
        font-size: 1rem;
      }

      .phase-desc {
        font-size: 0.8rem;
      }

      .scene-header-icon {
        width: 56px;
        height: 56px;
        font-size: 2rem;
      }

      .scene-header-info h1 {
        font-size: 1.25rem;
      }

      .tabs {
        padding-bottom: 6px;
      }

      .tab {
        padding: 6px 12px;
        font-size: 0.8rem;
      }

      .vocab-grid {
        grid-template-columns: 1fr;
      }

      .dialog-text {
        font-size: 0.9rem;
      }

      .dialog-text .cn {
        font-size: 0.8rem;
      }

      .fav-btn {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
      }
    }

    /* iPad 横屏优化 */
    @media (min-width: 1024px) and (max-width: 1366px) {
      .phases-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .scenes-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .vocab-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .main-content {
        max-width: 1000px;
        margin: 0 auto;
      }
    }

    /* iPad 竖屏优化 */
    @media (min-width: 768px) and (max-width: 1023px) {
      .phases-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .scenes-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .vocab-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 2rem;
      }

      .main-content {
        padding: 90px 20px 30px;
      }
    }

    /* 触摸设备优化 */
    @media (hover: none) and (pointer: coarse) {
      .play-btn, .vocab-play-btn {
        min-width: 36px;
        min-height: 36px;
      }

      .fav-btn {
        min-width: 40px;
        min-height: 40px;
      }

      .tab {
        padding: 12px 20px;
      }

      .scene-card, .phase-card {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .review-item {
        padding: 14px 0;
      }
    }

    /* Search results */
    .search-results {
      background: var(--color-card);
      border-radius: var(--radius-md);
      padding: 24px;
    }

    .search-result-item {
      padding: 16px;
      border-bottom: 1px solid var(--color-bg);
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover {
      background: var(--color-bg);
      border-radius: var(--radius-sm);
    }

    .search-result-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .search-result-meta {
      font-size: 0.875rem;
      color: var(--color-text-light);
    }

    .search-highlight {
      background: var(--color-primary-light);
      padding: 0 2px;
      border-radius: 2px;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="navbar-brand" onclick="app.goHome()">
      <span>👶</span>
      幼儿英语口语教程
    </div>
    <div class="mobile-menu-btn" onclick="app.toggleMobileMenu()">☰</div>
    <div class="navbar-nav" id="navbarNav">
      <div class="nav-item" onclick="app.goHome()">首页</div>
      <div class="nav-item" onclick="app.showFavorites()">收藏</div>
      <div class="nav-search">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="搜索..." onkeyup="app.handleSearch(event)">
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Dynamic content will be inserted here -->
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer">
    幼儿英语口语教程（3-6岁）· 共8个阶段 · 32个场景
  </footer>

  <!-- Load data -->
  <script src="data.js"></script>
  <script>
    // Application Logic
    const app = {
      currentPhase: null,
      currentScene: null,
      favorites: {},
      progress: {},
      reviewProgress: {},

      init() {
        this.loadStorage();
        this.goHome();
      },

      loadStorage() {
        try {
          const fav = localStorage.getItem('kidsEnglishFavorites');
          if (fav) this.favorites = JSON.parse(fav);

          const prog = localStorage.getItem('kidsEnglishProgress');
          if (prog) this.progress = JSON.parse(prog);

          const review = localStorage.getItem('kidsEnglishReview');
          if (review) this.reviewProgress = JSON.parse(review);
        } catch (e) {
          console.log('Storage not available');
        }
      },

      saveFavorites() {
        try {
          localStorage.setItem('kidsEnglishFavorites', JSON.stringify(this.favorites));
        } catch (e) {}
      },

      saveProgress() {
        try {
          localStorage.setItem('kidsEnglishProgress', JSON.stringify(this.progress));
        } catch (e) {}
      },

      saveReviewProgress() {
        try {
          localStorage.setItem('kidsEnglishReview', JSON.stringify(this.reviewProgress));
        } catch (e) {}
      },

      toggleMobileMenu() {
        document.getElementById('navbarNav').classList.toggle('open');
      },

      getPhaseColor(index) {
        const colors = [
          'var(--color-coral)',
          'var(--color-gold)',
          'var(--color-mint)',
          'var(--color-secondary)',
          'var(--color-lavender)',
          'var(--color-peach)',
          'var(--color-sage)',
          'var(--color-lilac)'
        ];
        return colors[index % colors.length];
      },

      getCompletedScenesCount() {
        return Object.keys(this.progress).length;
      },

      isPhaseCompleted(phaseId) {
        const phase = courseData.phases.find(p => p.id === phaseId);
        if (!phase) return false;
        return phase.scenes.every(s => this.progress[s.id]);
      },

      isSceneCompleted(sceneId) {
        return !!this.progress[sceneId];
      },

      toggleSceneComplete(sceneId) {
        if (this.progress[sceneId]) {
          delete this.progress[sceneId];
        } else {
          this.progress[sceneId] = true;
        }
        this.saveProgress();
        this.render();
      },

      toggleFavorite(type, id, data) {
        const key = `${type}:${id}`;
        if (this.favorites[key]) {
          delete this.favorites[key];
        } else {
          this.favorites[key] = { type, id, data, added: Date.now() };
        }
        this.saveFavorites();
        this.render();
      },

      isFavorite(type, id) {
        return !!this.favorites[`${type}:${id}`];
      },

      speak(text) {
        if (!window.speechSynthesis) {
          alert('您的浏览器不支持语音朗读功能');
          return;
        }
        // 停止当前正在播放的语音
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.5;
        utterance.pitch = 1.1;

        // 尝试选择英语语音
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith('en'));
        if (enVoice) {
          utterance.voice = enVoice;
        }

        window.speechSynthesis.speak(utterance);
      },

      toggleReviewItem(sceneId, index) {
        if (!this.reviewProgress[sceneId]) {
          this.reviewProgress[sceneId] = [];
        }
        const idx = this.reviewProgress[sceneId].indexOf(index);
        if (idx > -1) {
          this.reviewProgress[sceneId].splice(idx, 1);
        } else {
          this.reviewProgress[sceneId].push(index);
        }
        this.saveReviewProgress();
        this.render();
      },

      isReviewChecked(sceneId, index) {
        return this.reviewProgress[sceneId] && this.reviewProgress[sceneId].includes(index);
      },

      goHome() {
        this.currentPhase = null;
        this.currentScene = null;
        this.render();
      },

      showPhase(phaseId) {
        this.currentPhase = phaseId;
        this.currentScene = null;
        this.render();
      },

      showScene(phaseId, sceneId) {
        this.currentPhase = phaseId;
        this.currentScene = sceneId;
        this.render();
      },

      showFavorites() {
        this.currentPhase = 'favorites';
        this.currentScene = null;
        this.render();
      },

      handleSearch(e) {
        if (e.key === 'Enter') {
          const query = e.target.value.trim();
          if (query) {
            this.currentPhase = 'search';
            this.currentScene = query;
            this.render();
          }
        }
      },

      render() {
        const main = document.getElementById('mainContent');
        const footer = document.getElementById('footer');

        if (this.currentPhase === 'favorites') {
          main.innerHTML = this.renderFavorites();
          footer.style.display = 'block';
        } else if (this.currentPhase === 'search') {
          main.innerHTML = this.renderSearchResults(this.currentScene);
          footer.style.display = 'block';
        } else if (this.currentScene) {
          main.innerHTML = this.renderSceneDetail();
          footer.style.display = 'none';
        } else if (this.currentPhase) {
          main.innerHTML = this.renderPhaseDetail();
          footer.style.display = 'block';
        } else {
          main.innerHTML = this.renderHome();
          footer.style.display = 'block';
        }
      },

      renderHome() {
        const completed = this.getCompletedScenesCount();
        const total = courseData.phases.reduce((a, p) => a + p.scenes.length, 0);
        const progress = Math.round((completed / total) * 100);

        return `
          <div class="hero fade-in">
            <h1>幼儿英语口语教程</h1>
            <p class="hero-subtitle">1000+句日常口语 · 1000+核心词汇 · 32个生活场景</p>
            <div class="hero-stats">
              <div class="stat-item">
                <div class="stat-number">1000+</div>
                <div class="stat-label">核心口语</div>
              </div>
              <div class="stat-item">
                <div class="stat-number">1000+</div>
                <div class="stat-label">核心词汇</div>
              </div>
              <div class="stat-item">
                <div class="stat-number">32</div>
                <div class="stat-label">生活场景</div>
              </div>
            </div>
            <div class="hero-progress">
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progress}%"></div>
              </div>
              <div class="progress-text">学习进度：${completed}/${total} 场景 (${progress}%)</div>
            </div>
          </div>
          <div class="phases-grid fade-in">
            ${courseData.phases.map((phase, idx) => `
              <div class="phase-card ${this.isPhaseCompleted(phase.id) ? 'completed' : ''}" onclick="app.showPhase(${phase.id})">
                <div class="phase-header">
                  <span class="phase-number">阶段 ${phase.id}</span>
                  <span class="phase-status">${this.isPhaseCompleted(phase.id) ? '✅' : ''}</span>
                </div>
                <div class="phase-title">${phaseTitles[idx]}</div>
                <div class="phase-desc">${phase.description}</div>
                <div class="phase-scenes">
                  ${phase.scenes.map(s => `<span class="phase-scene-tag">${s.icon} ${s.title}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      renderPhaseDetail() {
        const phase = courseData.phases.find(p => p.id === this.currentPhase);
        if (!phase) return '';

        const phaseIndex = courseData.phases.indexOf(phase);

        return `
          <div class="page-header fade-in">
            <button class="back-btn" onclick="app.goHome()">←</button>
            <h1 class="page-title">${phase.title}</h1>
          </div>
          <div class="scenes-grid fade-in">
            ${phase.scenes.map(scene => `
              <div class="scene-card ${this.isSceneCompleted(scene.id) ? 'completed' : ''}" onclick="app.showScene(${phase.id}, '${scene.id}')">
                <div class="scene-icon" style="background: ${this.getPhaseColor(phaseIndex)}20;">
                  ${scene.icon}
                </div>
                <div class="scene-content">
                  <div class="scene-title">${scene.title}</div>
                  <div class="scene-desc">${scene.description || ''}</div>
                  <div class="scene-stats">
                    <span class="scene-stat">📝 ${scene.sentences?.length || 0} 句口语</span>
                    <span class="scene-stat">📚 ${scene.vocabulary?.length || 0} 个词汇</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      renderSceneDetail() {
        const phase = courseData.phases.find(p => p.id === this.currentPhase);
        const scene = phase?.scenes.find(s => s.id === this.currentScene);
        if (!scene) return '';

        const phaseIndex = courseData.phases.indexOf(phase);
        const bgColor = this.getPhaseColor(phaseIndex);

        // Default tab
        const tab = window.sceneTab || 'sentences';

        return `
          <div class="fade-in">
            <div class="breadcrumb">
              <a onclick="app.goHome()">首页</a>
              <span>›</span>
              <a onclick="app.showPhase(${phase.id})">${phase.title}</a>
              <span>›</span>
              <span>${scene.title}</span>
            </div>

            <div class="scene-header">
              <div class="scene-header-icon" style="background: ${bgColor}20;">${scene.icon}</div>
              <div class="scene-header-info">
                <h1>${scene.title}</h1>
                <div class="scene-header-desc">${scene.description || ''}</div>
              </div>
              <div class="scene-actions">
                <button class="btn-icon ${this.isSceneCompleted(scene.id) ? 'active' : ''}" onclick="app.toggleSceneComplete('${scene.id}')" title="标记完成">
                  ${this.isSceneCompleted(scene.id) ? '✓' : '○'}
                </button>
                <button class="btn-icon" onclick="window.print()" title="打印">🖨️</button>
              </div>
            </div>

            <div class="tabs">
              <div class="tab ${tab === 'sentences' ? 'active' : ''}" onclick="app.switchTab('sentences')">核心口语 (${scene.sentences?.length || 0})</div>
              <div class="tab ${tab === 'vocabulary' ? 'active' : ''}" onclick="app.switchTab('vocabulary')">核心词汇 (${scene.vocabulary?.length || 0})</div>
              <div class="tab ${tab === 'dialogs' ? 'active' : ''}" onclick="app.switchTab('dialogs')">亲子对话</div>
              <div class="tab ${tab === 'games' ? 'active' : ''}" onclick="app.switchTab('games')">游戏活动</div>
              <div class="tab ${tab === 'review' ? 'active' : ''}" onclick="app.switchTab('review')">复习要点</div>
              <div class="tab ${tab === 'tips' ? 'active' : ''}" onclick="app.switchTab('tips')">家长贴士</div>
            </div>

            ${this.renderSceneTab(scene, tab)}
          </div>
        `;
      },

      switchTab(tab) {
        window.sceneTab = tab;
        this.render();
      },

      renderSceneTab(scene, tab) {
        switch(tab) {
          case 'sentences':
            return this.renderSentences(scene);
          case 'vocabulary':
            return this.renderVocabulary(scene);
          case 'dialogs':
            return this.renderDialogs(scene);
          case 'games':
            return this.renderGames(scene);
          case 'review':
            return this.renderReview(scene);
          case 'tips':
            return this.renderTips(scene);
          default:
            return this.renderSentences(scene);
        }
      },

      renderSentences(scene) {
        if (!scene.sentences || scene.sentences.length === 0) {
          return '<div class="content-section">暂无数据</div>';
        }

        return `
          <div class="content-section">
            <div class="section-title">🗣️ 核心口语</div>
            <div class="sentences-list">
              ${scene.sentences.map((s, idx) => `
                <div class="sentence-card">
                  <div class="sentence-card-main">
                    <div class="sentence-en">
                      <button class="play-btn" onclick="app.speak(${JSON.stringify(s.en).replace(/"/g, '&quot;')})" title="朗读">▶</button>
                      <span>${s.en}</span>
                    </div>
                    <div class="sentence-cn">${s.cn}</div>
                  </div>
                  <div class="sentence-card-meta">
                    <span class="sentence-tone">${s.tone}</span>
                    <button class="fav-btn ${this.isFavorite('sentence', scene.id + '-' + idx) ? 'active' : ''}" onclick="app.toggleFavorite('sentence', '${scene.id}-${idx}', ${JSON.stringify(s).replace(/'/g, "&#39;")})">
                      ${this.isFavorite('sentence', scene.id + '-' + idx) ? '❤️' : '🤍'}
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderVocabulary(scene) {
        if (!scene.vocabulary || scene.vocabulary.length === 0) {
          return '<div class="content-section">暂无数据</div>';
        }

        return `
          <div class="content-section">
            <div class="section-title">📚 核心词汇</div>
            <div class="vocab-grid">
              ${scene.vocabulary.map((v, idx) => `
                <div class="vocab-item">
                  <button class="fav-btn vocab-fav ${this.isFavorite('vocab', scene.id + '-' + idx) ? 'active' : ''}" onclick="app.toggleFavorite('vocab', '${scene.id}-${idx}', ${JSON.stringify(v).replace(/'/g, "&#39;")})">
                    ${this.isFavorite('vocab', scene.id + '-' + idx) ? '❤️' : '🤍'}
                  </button>
                  <div class="vocab-word">
                    <button class="vocab-play-btn" onclick="app.speak(${JSON.stringify(v.word).replace(/"/g, '&quot;')})" title="朗读">▶</button>
                    <span>${v.word}</span>
                  </div>
                  <div class="vocab-phonetic">${v.phonetic}</div>
                  <div class="vocab-meta">
                    <span class="vocab-pos">${v.pos}</span>
                    <span class="vocab-cn">${v.cn}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      renderDialogs(scene) {
        if (!scene.dialogs || scene.dialogs.length === 0) {
          return '<div class="content-section">暂无数据</div>';
        }

        return `
          <div class="content-section">
            <div class="section-title">💬 亲子对话示例</div>
            ${scene.dialogs.map((dialog, idx) => `
              <div class="dialog-group">
                <div class="dialog-title">对话 ${idx + 1}</div>
                ${dialog.map(d => `
                  <div class="dialog-bubble">
                    <div class="dialog-avatar ${d.speaker.includes('家长') ? 'parent' : 'child'}">
                      ${d.speaker.includes('家长') ? '👩' : '👶'}
                    </div>
                    <div class="dialog-content">
                      <div class="dialog-speaker">${d.speaker}</div>
                      <div class="dialog-text">
                        <div style="display: flex; align-items: center; gap: 8px;">
                          <button class="play-btn" onclick="app.speak(${JSON.stringify(d.text).replace(/"/g, '&quot;')})" title="朗读">▶</button>
                          <span>${d.text}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>
        `;
      },

      renderGames(scene) {
        if (!scene.games || scene.games.length === 0) {
          return '<div class="content-section">暂无数据</div>';
        }

        const gameIcons = ['🎭', '🎵', '🪞', '🎪', '🎨', '🎲', '🎯', '🎸'];

        // 从描述中提取所有英文句子（引号中的）
        const extractEnglishSentences = (desc) => {
          const sentences = [];
          // 匹配引号中的内容
          const quoted = desc.match(/"[^"]+"/g);
          if (quoted) {
            quoted.forEach(q => sentences.push(q.replace(/"/g, '')));
          }
          // 匹配独立的大写英文短语（如"说Hello"中的Hello）
          const embedded = desc.match(/[\u4e00-\u9fa5][，。]?\s*([A-Z][a-zA-Z\s!?]+)(?=[\u4e00-\u9fa5]|$)/g);
          if (embedded) {
            embedded.forEach(e => {
              const match = e.match(/([A-Z][a-zA-Z\s!?]+)/);
              if (match && !sentences.includes(match[1])) {
                sentences.push(match[1].trim());
              }
            });
          }
          return sentences;
        };

        return `
          <div class="content-section">
            <div class="section-title">🎮 教学游戏活动</div>
            ${scene.games.map((g, idx) => {
              const sentences = extractEnglishSentences(g.desc);
              return `
              <div class="game-item">
                <div class="game-title">
                  <span>${gameIcons[idx % gameIcons.length]}</span>
                  ${sentences.map((s, sidx) => `
                    <button class="play-btn" onclick="app.speak(${JSON.stringify(s).replace(/"/g, '&quot;')})" title="朗读" style="margin-right: 4px;">▶</button>
                  `).join('')}
                  ${g.title}
                </div>
                <div class="game-desc">${g.desc}</div>
              </div>
            `}).join('')}
          </div>
        `;
      },

      renderReview(scene) {
        if (!scene.review || scene.review.length === 0) {
          return '<div class="content-section">暂无数据</div>';
        }

        // 从复习要点中提取英文短语
        const extractEnglishFromReview = (text) => {
          const phrases = [];
          // 匹配引号中的英文
          const quoted = text.match(/"[^"]+"/g);
          if (quoted) {
            quoted.forEach(q => phrases.push(q.replace(/"/g, '')));
          }
          // 匹配括号中的英文
          const bracketed = text.match(/\([^)]+\)/g);
          if (bracketed) {
            bracketed.forEach(b => {
              const content = b.replace(/[()]/g, '');
              if (/^[a-zA-Z\s\/\-!?]+$/.test(content)) {
                phrases.push(content);
              }
            });
          }
          // 匹配独立的英文单词/短语（前后有中文或标点）
          const words = text.match(/[\u4e00-\u9fa5，。]([a-zA-Z][a-zA-Z\s\/\-!?]*)/g);
          if (words) {
            words.forEach(w => {
              const match = w.match(/([a-zA-Z][a-zA-Z\s\/\-!?]*)/);
              if (match && !phrases.includes(match[1])) {
                phrases.push(match[1]);
              }
            });
          }
          return phrases;
        };

        return `
          <div class="content-section">
            <div class="section-title">✅ 复习要点清单</div>
            <ul class="review-list">
              ${scene.review.map((item, idx) => {
                const phrases = extractEnglishFromReview(item);
                return `
                <li class="review-item ${this.isReviewChecked(scene.id, idx) ? 'checked' : ''}" onclick="app.toggleReviewItem('${scene.id}', ${idx})">
                  <div class="review-checkbox ${this.isReviewChecked(scene.id, idx) ? 'checked' : ''}"></div>
                  <div class="review-text" style="display: flex; align-items: center; gap: 8px; flex: 1;">
                    ${phrases.map(p => `
                      <button class="play-btn" onclick="event.stopPropagation(); app.speak(${JSON.stringify(p).replace(/"/g, '&quot;')})" title="朗读">▶</button>
                    `).join('')}
                    <span>${item}</span>
                  </div>
                </li>
              `}).join('')}
            </ul>
          </div>
        `;
      },

      renderTips(scene) {
        if (!scene.tips) {
          return '<div class="content-section">暂无数据</div>';
        }

        return `
          <div class="content-section">
            <div class="section-title">💡 家长贴士</div>
            <div class="tips-box">
              <div class="tips-title">💝 给家长的建议</div>
              <div class="tips-content">${scene.tips}</div>
            </div>
          </div>
        `;
      },

      renderFavorites() {
        const favs = Object.values(this.favorites);
        if (favs.length === 0) {
          return `
            <div class="page-header fade-in">
              <button class="back-btn" onclick="app.goHome()">←</button>
              <h1 class="page-title">我的收藏</h1>
            </div>
            <div class="favorites-empty fade-in">
              <div class="favorites-empty-icon">🤍</div>
              <div class="favorites-empty-text">还没有收藏任何内容</div>
              <p style="color: var(--color-text-light); margin-top: 8px;">点击句子或词汇旁边的🤍按钮来收藏</p>
            </div>
          `;
        }

        const sentences = favs.filter(f => f.type === 'sentence');
        const vocabs = favs.filter(f => f.type === 'vocab');

        return `
          <div class="page-header fade-in">
            <button class="back-btn" onclick="app.goHome()">←</button>
            <h1 class="page-title">我的收藏 (${favs.length})</h1>
          </div>

          ${sentences.length > 0 ? `
            <div class="content-section fade-in">
              <div class="section-title">🗣️ 收藏的口语 (${sentences.length})</div>
              <table class="sentences-table">
                <tbody>
                  ${sentences.map(f => `
                    <tr>
                      <td>
                        <div class="sentence-en">${f.data.en}</div>
                        <div class="sentence-cn">${f.data.cn}</div>
                      </td>
                      <td>
                        <span class="sentence-tone">${f.data.tone}</span>
                      </td>
                      <td>
                        <button class="fav-btn active" onclick="app.toggleFavorite('sentence', '${f.id}', null); app.render();">❤️</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}

          ${vocabs.length > 0 ? `
            <div class="content-section fade-in">
              <div class="section-title">📚 收藏的词汇 (${vocabs.length})</div>
              <div class="vocab-grid">
                ${vocabs.map(f => `
                  <div class="vocab-item">
                    <button class="fav-btn vocab-fav active" onclick="app.toggleFavorite('vocab', '${f.id}', null); app.render();">❤️</button>
                    <div class="vocab-word">${f.data.word}</div>
                    <div class="vocab-phonetic">${f.data.phonetic}</div>
                    <div class="vocab-meta">
                      <span class="vocab-pos">${f.data.pos}</span>
                      <span class="vocab-cn">${f.data.cn}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        `;
      },

      renderSearchResults(query) {
        const results = [];
        const lowerQuery = query.toLowerCase();

        for (const phase of courseData.phases) {
          for (const scene of phase.scenes) {
            // Search in scene title
            if (scene.title.includes(query)) {
              results.push({ type: 'scene', phase, scene, match: scene.title });
              continue;
            }

            // Search in sentences
            if (scene.sentences) {
              for (const s of scene.sentences) {
                if (s.en.toLowerCase().includes(lowerQuery) || s.cn.includes(query)) {
                  results.push({ type: 'sentence', phase, scene, match: s.en, data: s });
                  break;
                }
              }
            }

            // Search in vocabulary
            if (scene.vocabulary) {
              for (const v of scene.vocabulary) {
                if (v.word.toLowerCase().includes(lowerQuery) || v.cn.includes(query)) {
                  results.push({ type: 'vocab', phase, scene, match: v.word, data: v });
                  break;
                }
              }
            }
          }
        }

        if (results.length === 0) {
          return `
            <div class="page-header fade-in">
              <button class="back-btn" onclick="app.goHome()">←</button>
              <h1 class="page-title">搜索结果</h1>
            </div>
            <div class="favorites-empty fade-in">
              <div class="favorites-empty-icon">🔍</div>
              <div class="favorites-empty-text">未找到与 "${query}" 相关的内容</div>
            </div>
          `;
        }

        return `
          <div class="page-header fade-in">
            <button class="back-btn" onclick="app.goHome()">←</button>
            <h1 class="page-title">搜索结果 (${results.length})</h1>
          </div>
          <div class="search-results fade-in">
            ${results.map(r => `
              <div class="search-result-item" onclick="app.showScene(${r.phase.id}, '${r.scene.id}')">
                <div class="search-result-title">${r.scene.icon} ${r.scene.title}</div>
                <div class="search-result-meta">
                  ${r.phase.title} · ${r.type === 'sentence' ? '口语' : r.type === 'vocab' ? '词汇' : '场景'}
                </div>
                ${r.data ? `
                  <div style="margin-top: 8px; padding: 8px; background: var(--color-bg); border-radius: var(--radius-sm);">
                    ${r.type === 'sentence' ? `
                      <div class="sentence-en">${r.data.en}</div>
                      <div class="sentence-cn">${r.data.cn}</div>
                    ` : `
                      <div class="vocab-word">${r.data.word} <span class="vocab-phonetic">${r.data.phonetic}</span></div>
                      <div style="font-size: 0.875rem; color: var(--color-text-light);">${r.data.cn}</div>
                    `}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }
    };

    // Initialize
    const phaseTitles = ['基础认知', '日常生活', '用餐时光', '游戏与学习', '户外探索', '社交互动', '综合能力', '进阶应用'];
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
